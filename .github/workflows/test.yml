# .github/workflows/test.yml
name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: texlyre-tests-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    # Public source checks run on GitHub-hosted runners, including fork PRs.
    # Release builds retain their separate, protected self-hosted workflow.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The reviewed upstream baseline is 40 commits behind this branch.
          # Keep enough fixed history for ancestry/source gates without pulling
          # the entire upstream repository on every self-hosted run.
          fetch-depth: 64
          filter: blob:none
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.1

      - name: Materialize reviewed baseline audit blobs
        shell: bash
        run: |
          baseline="$(node -p "require('./config/rinspace/upstream-baseline.json').upstream.commit")"
          git show "$baseline:LICENSE" >/dev/null
          git show "$baseline:pnpm-lock.yaml" >/dev/null

      - name: Install dependencies
        shell: bash
        run: |
          task_cpu="$(awk '/Cpus_allowed_list/ { split($2, ranges, /[-,]/); print ranges[1] }' /proc/self/status)"
          nice -n 15 taskset -c "$task_cpu" node scripts/rinspace/verify-cline-embed.mjs --download
          nice -n 15 taskset -c "$task_cpu" corepack enable pnpm
          nice -n 15 taskset -c "$task_cpu" corepack prepare pnpm@10.20.0 --activate
          nice -n 15 taskset -c "$task_cpu" pnpm install --frozen-lockfile

      - name: Check source foundation
        shell: bash
        run: |
          task_cpu="$(awk '/Cpus_allowed_list/ { split($2, ranges, /[-,]/); print ranges[1] }' /proc/self/status)"
          nice -n 15 taskset -c "$task_cpu" node scripts/rinspace/check-source.mjs
          nice -n 15 taskset -c "$task_cpu" node --test --test-concurrency=1 scripts/rinspace/*.test.mjs

      - name: Generate plugins
        shell: bash
        run: |
          task_cpu="$(awk '/Cpus_allowed_list/ { split($2, ranges, /[-,]/); print ranges[1] }' /proc/self/status)"
          nice -n 15 taskset -c "$task_cpu" pnpm generate:plugins

      - name: Check hook and application types
        shell: bash
        run: |
          task_cpu="$(awk '/Cpus_allowed_list/ { split($2, ranges, /[-,]/); print ranges[1] }' /proc/self/status)"
          nice -n 15 taskset -c "$task_cpu" pnpm exec tsc --project tsconfig.workspace.json
          nice -n 15 taskset -c "$task_cpu" pnpm exec tsc --noEmit

      - name: Lint changed core integration
        shell: bash
        run: |
          task_cpu="$(awk '/Cpus_allowed_list/ { split($2, ranges, /[-,]/); print ranges[1] }' /proc/self/status)"
          nice -n 15 taskset -c "$task_cpu" pnpm exec eslint src/utils/fileUtils.ts src/workspace src/services/AuthService.ts src/services/WorkspaceService.ts src/services/FileHandlerService.ts src/hooks/useDiskFiles.ts src/hooks/useDiskWriteStatus.ts src/types/projects.ts src/components/agent/AgentPanelHost.tsx src/components/app/AppRouter.tsx src/components/app/EditorApp.tsx src/components/editor/FileDocumentController.tsx src/components/project/ProjectImportModal.tsx src/components/project/WorkspaceCatalogSection.tsx src/components/workspace/WorkspaceModal.tsx src/components/workspace/WorkspaceStatusIndicator.tsx tests/services/AuthServiceLocalProfile.test.ts tests/services/WorkspaceLocalFolder.test.ts tests/services/WorkspaceService.test.ts tests/services/FileHandlerLocalWrites.test.ts tests/services/FileHandlerLocalDeletion.test.ts tests/components/FileTreeLocalDeletion.test.tsx tests/components/AuthLocalStartup.test.tsx tests/components/ProjectImportLocalFolder.test.tsx tests/components/WorkspaceCatalogSection.test.tsx tests/components/WorkspaceWriteStatus.test.tsx tests/components/DiskWriteNotifications.test.tsx tests/unit/hooks/editor/useEditorOutputLocalFiles.test.tsx tests/unit/workspace/RinspaceProjectCatalog.test.ts src/plugins/AgentPluginRegistry.ts src/plugins/PluginInterface.ts src/plugins/PluginRegistry.ts src/types/texlyre.ts texlyre.config.ts extras/agents/rinspace extras/bibliography/openalex/OpenAlexPanel.tsx extras/workspace/rinspace src/components/workspace/WorkspaceAccountIndicator.tsx src/components/profile/UserDropdown.tsx tests/components/WorkspaceAccountIndicator.test.tsx tests/services/RinspaceAccount.test.ts tests/unit/workspace/RinspaceRoutePolicy.test.ts --max-warnings 0
          nice -n 15 taskset -c "$task_cpu" pnpm exec eslint src/hooks/editor/useEditorOutput.ts src/extensions/texlyre-busytex/BusyTeXEngine.ts src/extensions/texlyre-busytex/BusyTeXRuntimeCache.ts src/extensions/texlyre-busytex/RinspaceCjkPackageSet.ts tests/unit/engines/BusyTeXRuntimeCache.test.ts tests/unit/engines/RinspaceCjkPackageSet.test.ts --max-warnings 0

      - name: Check deletion modules without new lint diagnostics
        shell: bash
        run: |
          task_cpu="$(awk '/Cpus_allowed_list/ { split($2, ranges, /[-,]/); print ranges[1] }' /proc/self/status)"
          nice -n 15 taskset -c "$task_cpu" node scripts/rinspace/check-deletion-lint.mjs

      - name: Lint automatic interface language and reopen regressions
        shell: bash
        run: |
          task_cpu="$(awk '/Cpus_allowed_list/ { split($2, ranges, /[-,]/); print ranges[1] }' /proc/self/status)"
          nice -n 15 taskset -c "$task_cpu" pnpm exec eslint src/App.tsx src/contexts/LocaleContext.tsx src/contexts/localeContextValue.ts src/hooks/useLanguage.ts src/utils/interfaceLanguage.ts src/settings/registerLocaleSettings.tsx src/components/settings/SettingsLanguage.tsx tests/unit/utils/interfaceLanguage.test.ts tests/components/InterfaceLanguage.test.tsx tests/components/UserDropdown.test.tsx tests/unit/workspace/RinspaceManagedGit.test.ts tests/unit/workspace/RinspaceManagedWorkspace.test.ts --max-warnings 0

      - name: Run local startup, folder and disk write regressions
        shell: bash
        run: |
          task_cpu="$(awk '/Cpus_allowed_list/ { split($2, ranges, /[-,]/); print ranges[1] }' /proc/self/status)"
          nice -n 15 taskset -c "$task_cpu" pnpm exec jest tests/services/AuthServiceLocalProfile.test.ts tests/services/WorkspaceLocalFolder.test.ts tests/services/WorkspaceService.test.ts tests/services/FileHandlerLocalWrites.test.ts tests/services/FileHandlerLocalDeletion.test.ts tests/services/FileHandlerService.test.ts tests/services/FileHandlerAnnotationMode.test.ts tests/components/FileTreeLocalDeletion.test.tsx tests/components/AuthLocalStartup.test.tsx tests/components/ProjectImportLocalFolder.test.tsx tests/components/WorkspaceCatalogSection.test.tsx tests/components/WorkspaceWriteStatus.test.tsx tests/components/DiskWriteNotifications.test.tsx tests/unit/hooks/editor/useEditorOutputLocalFiles.test.tsx tests/unit/workspace/LocalZipImport.test.ts tests/unit/workspace/RinspaceProjectCatalog.test.ts tests/components/WorkspaceAccountIndicator.test.tsx tests/services/RinspaceAccount.test.ts tests/unit/workspace/RinspaceRoutePolicy.test.ts --ci --runInBand

      - name: Run tests
        shell: bash
        run: |
          task_cpu="$(awk '/Cpus_allowed_list/ { split($2, ranges, /[-,]/); print ranges[1] }' /proc/self/status)"
          nice -n 15 taskset -c "$task_cpu" pnpm test:ci

      - name: Verify cold and warm package assets
        shell: bash
        run: |
          task_cpu="$(awk '/Cpus_allowed_list/ { split($2, ranges, /[-,]/); print ranges[1] }' /proc/self/status)"
          nice -n 15 taskset -c "$task_cpu" pnpm check:package-assets
          git diff --exit-code
