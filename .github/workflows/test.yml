# .github/workflows/test.yml
name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: texlyre-tests-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    # Trusted Rinspace branches use the private runner so GitHub-hosted quota
    # cannot block releases. Keep untrusted fork PRs away from that runner.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'rinspace-release-build' }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.1

      - name: Install dependencies
        shell: bash
        run: |
          task_cpu="$(awk '/Cpus_allowed_list/ { split($2, ranges, /[-,]/); print ranges[1] }' /proc/self/status)"
          nice -n 15 taskset -c "$task_cpu" corepack enable pnpm
          nice -n 15 taskset -c "$task_cpu" corepack prepare pnpm@10.20.0 --activate
          nice -n 15 taskset -c "$task_cpu" pnpm install --frozen-lockfile

      - name: Check source foundation
        shell: bash
        run: |
          task_cpu="$(awk '/Cpus_allowed_list/ { split($2, ranges, /[-,]/); print ranges[1] }' /proc/self/status)"
          nice -n 15 taskset -c "$task_cpu" node scripts/rinspace/check-source.mjs
          nice -n 15 taskset -c "$task_cpu" node --test --test-concurrency=1 scripts/rinspace/*.test.mjs

      - name: Generate plugins
        shell: bash
        run: |
          task_cpu="$(awk '/Cpus_allowed_list/ { split($2, ranges, /[-,]/); print ranges[1] }' /proc/self/status)"
          nice -n 15 taskset -c "$task_cpu" pnpm generate:plugins

      - name: Check hook and application types
        shell: bash
        run: |
          task_cpu="$(awk '/Cpus_allowed_list/ { split($2, ranges, /[-,]/); print ranges[1] }' /proc/self/status)"
          nice -n 15 taskset -c "$task_cpu" pnpm exec tsc --project tsconfig.workspace.json
          nice -n 15 taskset -c "$task_cpu" pnpm exec tsc --noEmit

      - name: Lint changed core integration
        shell: bash
        run: |
          task_cpu="$(awk '/Cpus_allowed_list/ { split($2, ranges, /[-,]/); print ranges[1] }' /proc/self/status)"
          nice -n 15 taskset -c "$task_cpu" pnpm exec eslint src/workspace src/services/AuthService.ts src/services/WorkspaceService.ts src/services/FileHandlerService.ts src/hooks/useDiskFiles.ts src/hooks/useDiskWriteStatus.ts src/types/projects.ts src/components/project/ProjectImportModal.tsx src/components/project/WorkspaceCatalogSection.tsx src/components/workspace/WorkspaceModal.tsx src/components/workspace/WorkspaceStatusIndicator.tsx tests/services/AuthServiceLocalProfile.test.ts tests/services/WorkspaceLocalFolder.test.ts tests/services/WorkspaceService.test.ts tests/services/FileHandlerLocalWrites.test.ts tests/services/FileHandlerLocalDeletion.test.ts tests/components/FileTreeLocalDeletion.test.tsx tests/components/AuthLocalStartup.test.tsx tests/components/ProjectImportLocalFolder.test.tsx tests/components/WorkspaceCatalogSection.test.tsx tests/components/WorkspaceWriteStatus.test.tsx tests/components/DiskWriteNotifications.test.tsx tests/unit/hooks/editor/useEditorOutputLocalFiles.test.tsx tests/unit/workspace/RinspaceProjectCatalog.test.ts src/plugins/PluginInterface.ts src/plugins/PluginRegistry.ts src/types/texlyre.ts texlyre.config.ts extras/bibliography/openalex/OpenAlexPanel.tsx extras/workspace/rinspace --max-warnings 0
          nice -n 15 taskset -c "$task_cpu" pnpm exec eslint src/hooks/editor/useEditorOutput.ts src/extensions/texlyre-busytex/BusyTeXEngine.ts src/extensions/texlyre-busytex/BusyTeXRuntimeCache.ts src/extensions/texlyre-busytex/RinspaceCjkPackageSet.ts tests/unit/engines/BusyTeXRuntimeCache.test.ts tests/unit/engines/RinspaceCjkPackageSet.test.ts --max-warnings 0

      - name: Check deletion modules without new lint diagnostics
        shell: bash
        run: |
          task_cpu="$(awk '/Cpus_allowed_list/ { split($2, ranges, /[-,]/); print ranges[1] }' /proc/self/status)"
          nice -n 15 taskset -c "$task_cpu" node scripts/rinspace/check-deletion-lint.mjs

      - name: Run local startup, folder and disk write regressions
        shell: bash
        run: |
          task_cpu="$(awk '/Cpus_allowed_list/ { split($2, ranges, /[-,]/); print ranges[1] }' /proc/self/status)"
          nice -n 15 taskset -c "$task_cpu" pnpm exec jest tests/services/AuthServiceLocalProfile.test.ts tests/services/WorkspaceLocalFolder.test.ts tests/services/WorkspaceService.test.ts tests/services/FileHandlerLocalWrites.test.ts tests/services/FileHandlerLocalDeletion.test.ts tests/services/FileHandlerService.test.ts tests/services/FileHandlerAnnotationMode.test.ts tests/components/FileTreeLocalDeletion.test.tsx tests/components/AuthLocalStartup.test.tsx tests/components/ProjectImportLocalFolder.test.tsx tests/components/WorkspaceCatalogSection.test.tsx tests/components/WorkspaceWriteStatus.test.tsx tests/components/DiskWriteNotifications.test.tsx tests/unit/hooks/editor/useEditorOutputLocalFiles.test.tsx tests/unit/workspace/LocalZipImport.test.ts tests/unit/workspace/RinspaceProjectCatalog.test.ts --ci --runInBand

      - name: Run tests
        shell: bash
        run: |
          task_cpu="$(awk '/Cpus_allowed_list/ { split($2, ranges, /[-,]/); print ranges[1] }' /proc/self/status)"
          nice -n 15 taskset -c "$task_cpu" pnpm test:ci

      - name: Verify cold and warm package assets
        shell: bash
        run: |
          task_cpu="$(awk '/Cpus_allowed_list/ { split($2, ranges, /[-,]/); print ranges[1] }' /proc/self/status)"
          nice -n 15 taskset -c "$task_cpu" pnpm check:package-assets
          git diff --exit-code

      - name: Review upstream external archive bytes
        shell: bash
        run: |
          task_cpu="$(awk '/Cpus_allowed_list/ { split($2, ranges, /[-,]/); print ranges[1] }' /proc/self/status)"
          nice -n 15 taskset -c "$task_cpu" node scripts/rinspace/review-external-assets.mjs
