name: Formal Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact reviewed Rinspace TeXlyre tag
        required: true
        type: string
      reuse_texlive_runtime:
        description: Verify and reuse the exact reviewed published TeX Live bytes
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: texlyre-formal-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'rinspacehq/texlyre' && github.ref == 'refs/heads/main'
    runs-on: [rinspace-release-build, rinspace-public-texlyre-isolated]
    timeout-minutes: 240
    env:
      RINSPACE_ASSET_ARCHIVE_CACHE_DIR: /repositories/data/texlyre-asset-cache
      RINSPACE_TEXLIVE_ARTIFACT_CACHE_DIR: /repositories/data/texlyre-runtime-artifact-cache
    steps:
      - name: Checkout exact public main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 64
          filter: blob:none
          persist-credentials: false

      - name: Fix and verify release identity
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          expected="$(node -p "require('./config/rinspace/release.json').releaseTag")"
          test "$RELEASE_TAG" = "$expected"
          test "$GITHUB_REF" = refs/heads/main
          git checkout -B main "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git remote -v

      - name: Set up fixed Node and pnpm
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.1

      - name: Materialize reviewed baseline audit blobs
        shell: bash
        run: |
          baseline="$(node -p "require('./config/rinspace/upstream-baseline.json').upstream.commit")"
          git show "$baseline:LICENSE" >/dev/null
          git show "$baseline:pnpm-lock.yaml" >/dev/null

      - name: Install frozen dependencies on one CPU
        shell: bash
        run: |
          task_cpu="$(awk '/Cpus_allowed_list/ { split($2, ranges, /[-,]/); print ranges[1] }' /proc/self/status)"
          nice -n 15 taskset -c "$task_cpu" corepack enable pnpm
          nice -n 15 taskset -c "$task_cpu" corepack prepare pnpm@10.20.0 --activate
          nice -n 15 taskset -c "$task_cpu" pnpm install --frozen-lockfile

      - name: Re-run source, test and asset gates
        shell: bash
        run: |
          task_cpu="$(awk '/Cpus_allowed_list/ { split($2, ranges, /[-,]/); print ranges[1] }' /proc/self/status)"
          nice -n 15 taskset -c "$task_cpu" node scripts/rinspace/check-source.mjs
          nice -n 15 taskset -c "$task_cpu" node --test --test-concurrency=1 scripts/rinspace/*.test.mjs
          nice -n 15 taskset -c "$task_cpu" pnpm generate:plugins
          nice -n 15 taskset -c "$task_cpu" pnpm exec tsc --project tsconfig.workspace.json
          nice -n 15 taskset -c "$task_cpu" pnpm exec tsc --noEmit
          nice -n 15 taskset -c "$task_cpu" pnpm test:ci
          nice -n 15 taskset -c "$task_cpu" pnpm check:package-assets

      - name: Build self-contained editor on one CPU
        shell: bash
        run: |
          task_cpu="$(awk '/Cpus_allowed_list/ { split($2, ranges, /[-,]/); print ranges[1] }' /proc/self/status)"
          nice -n 15 taskset -c "$task_cpu" pnpm build:prod
          test -f dist/index.html
          test -f dist/rinspace-source-candidate.json

      - name: Verify and reuse the exact published TeX Live runtime
        if: inputs.reuse_texlive_runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          task_cpu="$(awk '/Cpus_allowed_list/ { split($2, ranges, /[-,]/); print ranges[1] }' /proc/self/status)"
          nice -n 15 taskset -c "$task_cpu" node scripts/rinspace/prepare-reviewed-texlive-runtime.cjs --verify-only

      - name: Fetch and verify the fixed TeX Live 2026 tree list
        if: ${{ !inputs.reuse_texlive_runtime }}
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/texlyre-texlive-source"
          mkdir -p "$source_dir"
          tree_url="$(node -p "require('./config/rinspace/texlive-full-runtime.review.json').treeList.url")"
          curl --fail --location --retry 5 --retry-all-errors --output "$source_dir/texlive-full.txt" "$tree_url"
          test "$(stat -c %s "$source_dir/texlive-full.txt")" = "$(node -p "require('./config/rinspace/texlive-full-runtime.review.json').treeList.size")"
          test "$(sha256sum "$source_dir/texlive-full.txt" | cut -d' ' -f1)" = "$(node -p "require('./config/rinspace/texlive-full-runtime.review.json').treeList.sha256")"

      - name: Build the complete on-demand TeX Live runtime on one CPU
        if: ${{ !inputs.reuse_texlive_runtime }}
        shell: bash
        run: |
          set -euo pipefail
          task_cpu="$(awk '/Cpus_allowed_list/ { split($2, ranges, /[-,]/); print ranges[1] }' /proc/self/status)"
          source_dir="$RUNNER_TEMP/texlyre-texlive-source"
          runtime_dir="$RUNNER_TEMP/texlyre-texlive-runtime"
          mkdir -p "$runtime_dir"
          archive_url="$(node -p "require('./config/rinspace/texlive-full-runtime.review.json').archive.url")"
          archive_sha_file="$source_dir/archive.sha256"
          archive_size_file="$source_dir/archive.size"
          curl --fail --location --retry 5 --retry-all-errors "$archive_url" \
            | tee >(sha256sum | awk '{print $1}' > "$archive_sha_file") >(wc -c | tr -d ' ' > "$archive_size_file") \
            | zstd -dc \
            | nice -n 15 taskset -c "$task_cpu" node scripts/rinspace/build-texlive-runtime-stream.cjs \
                "$source_dir/texlive-full.txt" "$runtime_dir"
          for attempt in 1 2 3 4 5; do
            [[ -s "$archive_sha_file" && -s "$archive_size_file" ]] && break
            sleep 1
          done
          test "$(cat "$archive_size_file")" = "$(node -p "require('./config/rinspace/texlive-full-runtime.review.json').archive.size")"
          test "$(cat "$archive_sha_file")" = "$(node -p "require('./config/rinspace/texlive-full-runtime.review.json').archive.sha256")"
          pack="$(node -p "require('./config/rinspace/release.json').texliveRuntime.packFilename")"
          maximum="$(node -p "require('./config/rinspace/release.json').texliveRuntime.maximumPackBytes")"
          test "$(stat -c %s "$runtime_dir/$pack")" -lt "$maximum"

      - name: Assemble exact source, notices and static artifacts
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          REUSE_TEXLIVE_RUNTIME: ${{ inputs.reuse_texlive_runtime }}
          # Node 24 fetch() must use the sandbox's allowlisted HTTPS proxy.
          NODE_USE_ENV_PROXY: '1'
        run: |
          task_cpu="$(awk '/Cpus_allowed_list/ { split($2, ranges, /[-,]/); print ranges[1] }' /proc/self/status)"
          output="$RUNNER_TEMP/texlyre-release"
          nice -n 15 taskset -c "$task_cpu" node scripts/rinspace/assemble-release.cjs --tag "$RELEASE_TAG" --output "$output"
          artifact="$(node -p "require('./config/rinspace/release.json').artifact.filename")"
          runtime_manifest="$(node -p "require('./config/rinspace/release.json').texliveRuntime.manifestFilename")"
          runtime_pack="$(node -p "require('./config/rinspace/release.json').texliveRuntime.packFilename")"
          runtime_index="$(node -p "require('./config/rinspace/release.json').texliveRuntime.indexFilename")"
          cd "$output"
          sha256sum -c "$artifact.sha256"
          source_archive="$(find . -maxdepth 1 -type f -name 'texlyre-source-*.tar.gz' -printf '%f\n')"
          test -n "$source_archive"
          sha256sum -c "$source_archive.sha256"
          tar -tzf "$artifact" > artifact-files.txt
          test "$(sed -n '1p' artifact-files.txt)" = editor/
          grep -q '^editor/notices/external/font-assets/LICENSES/' artifact-files.txt
          grep -qx 'editor/rinspace-release.json' artifact-files.txt
          if [[ "$REUSE_TEXLIVE_RUNTIME" == true ]]; then
            # The verified public v0.13.2-rinspace.3 release already owns these
            # immutable 2 GiB runtime bytes. Publish its exact reviewed reference,
            # not another upload of the same pack with a new editor release.
            cp "$GITHUB_WORKSPACE/config/rinspace/texlive-published-runtime.review.json" "$output/texlive-runtime-reference.json"
            (cd "$output" && sha256sum texlive-runtime-reference.json > texlive-runtime-reference.json.sha256)
          else
            runtime_dir="$RUNNER_TEMP/texlyre-texlive-runtime"
            mv "$runtime_dir"/* "$output/"
            test "$(node -p "require('$output/$runtime_manifest').files")" = 180810
            test "$(node -p "require('$output/$runtime_manifest').pack.filename")" = "$runtime_pack"
            test "$(node -p "require('$output/$runtime_manifest').index.filename")" = "$runtime_index"
            (cd "$output" && sha256sum "$runtime_pack" "$runtime_index" "$runtime_manifest" > texlive-2026-rinspace.1.sha256)
          fi

      - name: Publish immutable public release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          output="$RUNNER_TEMP/texlyre-release"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "$output"/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Rinspace TeXlyre $RELEASE_TAG" \
            --notes $'Self-contained browser editor for the `/editor/` route. The fixed TeX Live 2026 runtime is attached when rebuilt, or referenced by its exact published release and asset digests when reused. Browser workers perform compilation; the server returns immutable files.\n\nThe fork and Rinspace integration remain AGPL-3.0-or-later. TeX Live files retain their package-specific licenses. The attached manifests bind the exact source commit/tree, complete application source archive, static artifact, runtime reference or rebuilt bytes, dependency notices, external asset notices and SHA-256 values. Publication alone does not change the private product lock or production.'

      - name: Verify published assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REUSE_TEXLIVE_RUNTIME: ${{ inputs.reuse_texlive_runtime }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,targetCommitish,isDraft,isPrerelease,assets
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$GITHUB_SHA"
          if [[ "$REUSE_TEXLIVE_RUNTIME" == true ]]; then
            test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name]|index("texlive-runtime-reference.json") != null')" = true
            test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name]|index("texlive-2026-rinspace.1.pack") == null')" = true
          fi
